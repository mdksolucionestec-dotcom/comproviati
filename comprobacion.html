<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>App no disponible</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5fb;color:#1a1a4e;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{background:#fff;border-radius:16px;padding:40px 28px;max-width:480px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  h1{font-size:1.5rem;margin:0 0 12px}
  p{color:#555;line-height:1.5;margin:0}
</style>
</head>
<body>
  <div class="box">
    <h1>Esta aplicación ya no está disponible</h1>
    <p>La herramienta de comprobación de viáticos fue retirada. Puedes desinstalarla de tu equipo o quitarla de tus favoritos.</p>
  </div>
<script>
  // Por si el navegador aún tiene registrado el service worker viejo, lo da de baja y borra la caché
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    });
  }
  if (window.caches) {
    caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
  }
</script>
</body>
</html>
