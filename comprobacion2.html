<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1080">
<title>Comprobación de viáticos — Inactiva</title>
<style>
  :root{ --azul:#1A1080; --amarillo:#FFE600; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#1A1080;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
  .caja{max-width:440px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:34px 26px}
  .ico{font-size:46px;margin-bottom:10px}
  h1{font-size:20px;margin:0 0 6px;font-weight:800}
  .sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-bottom:18px}
  p{font-size:15px;line-height:1.5;opacity:.92;margin:0 0 14px}
  .barra{height:4px;width:70px;background:var(--amarillo);border-radius:3px;margin:0 auto 18px}
  .nota{font-size:12.5px;opacity:.7;margin-top:18px}
  .marca{margin-top:22px;font-size:12px;opacity:.6;letter-spacing:.08em}
</style>
</head>
<body>
  <div class="caja">
    <div class="ico">🔧</div>
    <div class="barra"></div>
    <h1>Comprobación de viáticos</h1>
    <div class="sub">Temporalmente inactiva</div>
    <p>La aplicación está en <b>mantenimiento</b> por el momento. Vuelve a intentarlo más tarde.</p>
    <p class="nota">Si necesitas ayuda, contacta al área administrativa.</p>
    <div class="marca">M Dreieck</div>
  </div>
<script>
  /* Apaga la versión instalada/cacheada: quita el service worker y borra la caché. */
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
    }
  }catch(e){}
</script>
</body>
</html>
